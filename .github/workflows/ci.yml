name: CI

# Validation sur push de branche et pull request. La CI n'utilise PAS ./x.sh (pas de conteneur) :
# elle installe directement la toolchain épinglée sur les runners GitHub. Les versions doivent
# rester alignées avec docker/Dockerfile et rust-toolchain.toml.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NODE_VERSION: "22.14.0"
  PLAYWRIGHT_VERSION: "1.65.0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libjavascriptcoregtk-4.1-dev patchelf
      - name: Toolchain Rust (épinglée)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Installer nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace
      - name: Vérifier les bindings TS (générés, non modifiés à la main)
        run: |
          cargo test -p netsift-api export_bindings || true
          git diff --exit-code ui/src/api/types || \
            (echo "Bindings TS obsolètes : régénérer avec ./x.sh cargo test -p netsift-api export_bindings" && exit 1)

  deny:
    name: Licences et avis de sécurité
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.99.1" }
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-deny }
      - run: cargo deny check

  ui:
    name: UI (lint, typecheck, tests, visuels)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Dépendances système (Tauri, pour la génération des types via le backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libjavascriptcoregtk-4.1-dev patchelf
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.99.1" }
      - uses: Swatinem/rust-cache@v2
      - working-directory: ui
        run: npm ci
      - working-directory: ui
        run: npm run lint
      - working-directory: ui
        run: npm run typecheck
      - working-directory: ui
        run: npm run test -- --run
      - name: Navigateur Playwright
        working-directory: ui
        run: npx playwright@${{ env.PLAYWRIGHT_VERSION }} install --with-deps chromium
      - name: Captures et vérifications visuelles
        run: bash scripts/ci/shots.sh
      - name: Publier les captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: .artifacts/screens
          if-no-files-found: ignore
