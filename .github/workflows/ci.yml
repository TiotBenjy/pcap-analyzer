name: CI

# Validation sur push de branche et pull request. La CI n'utilise PAS ./x.sh (pas de conteneur) :
# elle installe directement la toolchain épinglée sur les runners GitHub. Les versions doivent
# rester alignées avec docker/Dockerfile, rust-toolchain.toml et docs/STACK_VERSIONS.md.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  RUST_VERSION: "1.99.1"
  NODE_VERSION: "22.14.0"
  NEXTEST_VERSION: "0.9.151"
  DENY_VERSION: "0.20.2"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, tests, bindings)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Dépendances système (Tauri / WebKitGTK, pour compiler apps/desktop)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libjavascriptcoregtk-4.1-dev patchelf
      - name: Toolchain Rust (épinglée)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo nextest run --locked --workspace
      - name: Bindings TS à jour (générés par ts-rs, jamais édités à la main)
        run: |
          cargo test --locked -p netsift-api export_bindings
          git diff --exit-code -- ui/src/api/types || {
            echo "::error::Bindings TS obsolètes : ./x.sh cargo test -p netsift-api export_bindings, puis committer ui/src/api/types"
            exit 1
          }

  deny:
    name: Licences et avis de sécurité
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@${{ env.DENY_VERSION }}
      - run: cargo deny check

  ui:
    name: UI (lint, typecheck, tests, visuels)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # Les tests visuels démarrent la vraie API (netsift serve) : toolchain Rust nécessaire,
      # mais pas WebKitGTK (seul netsift-cli est compilé).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ui
      - working-directory: ui
        run: npm ci
      - working-directory: ui
        run: npm run lint
      - working-directory: ui
        run: npm run typecheck
      - working-directory: ui
        run: npm run test -- --run
      - name: Navigateur Playwright (version de ui/package-lock.json)
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: Captures et vérifications visuelles
        run: bash scripts/ci/shots.sh
      - name: Publier les captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screens
          path: .artifacts/screens
          if-no-files-found: ignore
          retention-days: 14
