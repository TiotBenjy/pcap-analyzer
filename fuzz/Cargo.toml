# cargo-fuzz targets (nightly, outside the main workspace: see docs/FUZZING.md).
# Run through `./x.sh fuzz`, never directly.
[package]
name = "netsift-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

# Own workspace: the root workspace excludes `fuzz/`.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4.13"
netsift-analyze = { path = "../crates/netsift-analyze", features = ["fuzzing"] }
netsift-capture = { path = "../crates/netsift-capture" }
netsift-engine = { path = "../crates/netsift-engine" }
netsift-geo = { path = "../crates/netsift-geo" }

[dev-dependencies]
# Seed generator (examples/gen_corpus.rs) only.
flate2 = "1.1.11"
netsift-fixtures = { path = "../crates/netsift-fixtures" }
netsift-geo = { path = "../crates/netsift-geo", features = ["test-util"] }

[profile.release]
# Line tables for readable crash backtraces.
debug = 1

[lints.rust]
unsafe_code = "forbid"

# One binary per target (fuzz_targets/<name>.rs), sorted.
[[bin]]
name = "analyzers"
path = "fuzz_targets/analyzers.rs"
test = false
doc = false
bench = false

