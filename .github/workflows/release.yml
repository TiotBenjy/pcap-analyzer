name: Release

# Déclenché par un tag v* sur main. Construit les bundles desktop pour Linux ET Windows
# (c'est l'objet de la CI : produire le binaire Windows sans toolchain Windows chez l'utilisateur),
# puis crée une release GitHub en brouillon avec les artefacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "22.14.0"

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système Linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libjavascriptcoregtk-4.1-dev patchelf

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - working-directory: ui
        run: npm ci

      - name: Télécharger la base GeoIP (incluse dans le bundle)
        shell: bash
        run: bash scripts/ci/geoip.sh || echo "GeoIP indisponible, bundle sans base (pays inconnu)"

      - name: Build et bundle Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "NetSift ${{ github.ref_name }}"
          releaseBody: "Bundles Linux (AppImage, .deb) et Windows (NSIS, MSI). Voir CHANGELOG."
          releaseDraft: true
          prerelease: false
