name: CI

# Validation sur push de branche et pull request. La CI n'utilise PAS ./x.sh (pas de conteneur) :
# elle installe directement la toolchain épinglée sur les runners GitHub. Les versions doivent
# rester alignées avec docker/Dockerfile, rust-toolchain.toml et docs/STACK_VERSIONS.md.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  RUST_VERSION: "1.99.1"
  NODE_VERSION: "22.14.0"
  NEXTEST_VERSION: "0.9.151"
  DENY_VERSION: "0.20.2"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Version unique et scripts de release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      # Cargo.toml (source de vérité), ui/package.json, ui/package-lock.json, Cargo.lock (ADR-011).
      - run: bash scripts/check-version.sh
      - run: bash scripts/tests/check-version.sh
      - run: bash scripts/tests/release.sh
      - run: bash scripts/tests/cache.sh
      # shellcheck est préinstallé sur les runners Ubuntu.
      - name: shellcheck (x.sh, wt.sh, scripts de version, de release, de cache, de fuzzing, de bench et de licences)
        run: |
          shellcheck --version | head -2
          shellcheck -x scripts/check-version.sh scripts/release.sh scripts/release-status.sh \
            scripts/tests/check-version.sh scripts/tests/release.sh scripts/ct/cliff.sh \
            scripts/lib/cache.sh scripts/ct/cache.sh scripts/tests/cache.sh x.sh scripts/wt.sh \
            scripts/ct/fuzz.sh scripts/ci/fuzz.sh scripts/ct/bench.sh scripts/ct/licenses.sh

  rust:
    name: Rust (fmt, clippy, tests, bindings)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Dépendances système (Tauri / WebKitGTK, pour compiler apps/desktop)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libjavascriptcoregtk-4.1-dev patchelf
      - name: Toolchain Rust (épinglée)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo nextest run --locked --workspace
      # fuzz/ (hors workspace, nightly pour fuzzer) : format, typage des cibles et tests de sa
      # bibliothèque sur la stable, dans le target du workspace (mis en cache).
      - name: fuzz/ (format, compilation, tests de la bibliothèque)
        env:
          CARGO_TARGET_DIR: target
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml --check
          cargo check --locked --manifest-path fuzz/Cargo.toml --all-targets
          cargo test --locked --manifest-path fuzz/Cargo.toml --lib
      - name: Bindings TS à jour (générés par ts-rs, jamais édités à la main)
        run: |
          cargo test --locked -p netsift-api export_bindings
          git diff --exit-code -- ui/src/api/types || {
            echo "::error::Bindings TS obsolètes : ./x.sh cargo test -p netsift-api export_bindings, puis committer ui/src/api/types"
            exit 1
          }

  deny:
    name: Licences et avis de sécurité
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@${{ env.DENY_VERSION }}
      - run: cargo deny check

  licenses:
    name: Licences tierces (liste à jour)
    # Liste des crates Rust et paquets npm embarqués (« À propos », THIRD-PARTY-NOTICES.txt des
    # bundles) : régénérée par le même script que ./x.sh licenses, puis comparée aux fichiers commités.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - working-directory: ui
        run: npm ci --ignore-scripts
      # cargo-about à la version épinglée dans scripts/ct/licenses.sh (source unique), binaire
      # précompilé. S'il manque (outil ou version absents du manifeste de l'action), le script le
      # compile dans le répertoire temporaire du runner (feature `cli`, environ 1 min).
      - name: Version de cargo-about
        id: about
        run: echo "version=$(sed -n 's/^CARGO_ABOUT_VERSION="\(.*\)"$/\1/p' scripts/ct/licenses.sh)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        continue-on-error: true
        with:
          tool: cargo-about@${{ steps.about.outputs.version }}
      - name: Liste régénérée et comparée
        env:
          NETSIFT_TOOLS_DIR: ${{ runner.temp }}/tools
          NETSIFT_TOOLS_TARGET: ${{ runner.temp }}/tools-target
        run: bash scripts/ct/licenses.sh --check

  ui:
    name: UI (lint, typecheck, tests, visuels)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # Les tests visuels démarrent la vraie API (netsift serve) : toolchain Rust nécessaire,
      # mais pas WebKitGTK (seul netsift-cli est compilé).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ui
      - working-directory: ui
        run: npm ci
      - working-directory: ui
        run: npm run lint
      - working-directory: ui
        run: npm run typecheck
      - working-directory: ui
        run: npm run test -- --run
      - name: Navigateurs Playwright (version de ui/package-lock.json ; WebKit pour le test de fumée desktop)
        working-directory: ui
        run: npx playwright install --with-deps chromium webkit
      - name: Captures et vérifications visuelles
        run: bash scripts/ci/shots.sh
      - name: Publier les captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screens
          path: .artifacts/screens
          if-no-files-found: ignore
          retention-days: 14

  fuzz:
    name: Fuzz (60 s par cible)
    # Facultatif : sur main et à la demande seulement, pour ne pas allonger la validation des
    # branches. Campagne courte de régression ; les campagnes longues se lancent en local
    # (./x.sh fuzz all 1800, docs/FUZZING.md).
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # Versions épinglées dans scripts/ct/fuzz.sh (source unique).
      - name: Versions de la nightly et de cargo-fuzz
        id: pins
        run: |
          nightly="$(sed -n 's/^NIGHTLY="\(.*\)"$/\1/p' scripts/ct/fuzz.sh)"
          echo "nightly=$nightly" >> "$GITHUB_OUTPUT"
          echo "cargo_fuzz=$(sed -n 's/^CARGO_FUZZ_VERSION="\(.*\)"$/\1/p' scripts/ct/fuzz.sh)" >> "$GITHUB_OUTPUT"
          # Toutes les étapes suivantes (cache compris) voient la nightly, pas la stable de
          # rust-toolchain.toml.
          echo "RUSTUP_TOOLCHAIN=$nightly" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pins.outputs.nightly }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzz
          # Seuls les targets du fuzzing (scripts/ct/fuzz.sh : target/fuzz, target/fuzz-gen).
          workspaces: |
            fuzz -> ../target/fuzz
            fuzz -> ../target/fuzz-gen
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@${{ steps.pins.outputs.cargo_fuzz }}
      - name: Graines, compilation et campagne (toutes les cibles, 60 s chacune)
        run: |
          bash scripts/ci/fuzz.sh corpus
          bash scripts/ci/fuzz.sh all 60
      - name: Publier les entrées qui plantent et les journaux
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz
          path: |
            fuzz/artifacts
            .artifacts/fuzz
          if-no-files-found: ignore
          retention-days: 14
