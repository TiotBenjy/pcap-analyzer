# cargo-deny : licences permissives uniquement, pas d'avis de sécurité non traités.
# Durci progressivement (au début du projet, `./x.sh check` n'échoue pas sur deny ; la CI, si).

[advisories]
version = 2
yanked = "deny"
# "unmaintained" ne vise que nos dépendances directes : les transitives de Tauri (gtk-rs, zbus)
# ne sont pas sous notre contrôle. Les vulnérabilités restent bloquantes quelle que soit la profondeur.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
# Permissives autorisées. Pas de GPL/AGPL (on ne porte aucun code de Wireshark/NetworkMiner).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
]
confidence-threshold = 0.9
# The allow-list anticipates future dependencies: do not warn on unused entries.
unused-allowed-license = "allow"
# La base GeoIP DB-IP Lite est CC BY 4.0 (donnée, pas du code) : attribution gérée dans l'app, hors scope deny.

[bans]
multiple-versions = "deny"
# Duplicates pulled by Tauri (GTK/WebKit, wry, codegen, plugins) or by test-only crates are outside
# our control: ignore their subtrees so that the remaining warnings are the ones we can act on.
# A duplicate between our own crates and these trees (e.g. sha2 0.11 here, 0.10 in wry) is also
# hidden: we keep the latest version on our side rather than follow Tauri's lag.
skip-tree = [
  { crate = "tauri", reason = "GTK/WebKit, wry and codegen versions follow Tauri" },
  { crate = "tauri-build", reason = "build-time dependencies of Tauri" },
  { crate = "tauri-plugin", reason = "build-time dependencies of Tauri plugins" },
  { crate = "proptest", reason = "test-only dependency" },
]
wildcards = "deny"
# Internal path dependencies (publish = false) are not wildcards in practice.
allow-wildcard-paths = true
# Interdire explicitement un éventuel binding libpcap/pcap système (ADR-002 : parsing 100% Rust).
deny = [
  { name = "pcap" },
  { name = "libpcap-sys" },
  { name = "pcap-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
