name: Release

# Déclenché par un tag v* sur main (ou manuellement). Construit les bundles desktop pour Linux ET
# Windows (c'est l'objet de la CI : produire le binaire Windows sans toolchain Windows chez
# l'utilisateur), puis crée une release GitHub en brouillon avec les artefacts.
# L'UI est construite par `beforeBuildCommand` (apps/desktop/tauri.conf.json).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  RUST_VERSION: "1.99.1"
  NODE_VERSION: "22.14.0"
  TAURI_CLI_VERSION: "2.12.4"

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # glibc 2.35, comme l'image de dev
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libjavascriptcoregtk-4.1-dev patchelf

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@${{ env.TAURI_CLI_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # GeoIP (P2.2) : la base DB-IP sera téléchargée ici et déclarée dans `bundle.resources`.

      - name: Build et bundle Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: cargo tauri
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "NetSift ${{ github.ref_name }}"
          releaseBody: "Bundles Linux (AppImage, .deb) et Windows (NSIS, MSI). Non signés."
          releaseDraft: true
          prerelease: false

      # Exécution manuelle (sans tag) : les bundles sont publiés comme artefacts du workflow.
      - name: Artefacts (exécution manuelle)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.target }}
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
